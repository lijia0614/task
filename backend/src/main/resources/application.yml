server:
  port: 8080
spring:
  application:
    name: task-backend
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/task_assign?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
minio:
  endpoint: http://127.0.0.1:9000
  public-url: http://127.0.0.1:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: task-attachments
jwt:
  secret: TaskAssignSystemSecretKey0123456789abcdefghijklmnopqrstuvwxyz
  expire-hours: 72
